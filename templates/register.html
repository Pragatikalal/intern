{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}
<div class="card auth"><h1>Register</h1>
<form method="post" class="grid"><input type="hidden" name="_csrf" value="{{ csrf_token }}">
<label>Username<input name="username" required pattern="[A-Za-z0-9_]{3,30}"></label>
<label>Password (min 8 characters)<input type="password" name="password" minlength="8" required></label>
<button>Create account</button></form>
<p class="muted">The first account created becomes the administrator.</p>
<p><a href="{{ url_for('auth.login') }}">Back to sign in</a></p></div>
{% endblock %}
